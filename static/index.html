<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Credentials Example</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/svbstrate@5.1.0/svbstrate.css"
    />
    <link rel="stylesheet" href="style.css" />

    <script src="http://localhost:4001/script.js"></script>
  </head>
  <body class="bg-light" style="height: 100vh">
    <div class="h f aic jcc">
      <button id="button" class="m2">Open Credentials Widget</button>
      <button id="military-button" class="m2">Open Military Widget</button>
      <button id="reboot-button" class="m2">Reboot Widget</button>
    </div>

    <script>
      document.getElementById("button").addEventListener("click", async () => {
        const { params } = await fetch("/session")
          .then((res) => res.json())
          .catch(() => {
            alert("Could not fetch token");
            return {};
          });

        const callbacks = {
          onEvent: (event) => console.log(`onEvent ${JSON.stringify(event, null, 2)}`),
          onComplete: (data) => console.log(`onComplete ${JSON.stringify(data, null, 2)}`),
        }

        const blend = Truework.direct.blend.init(params, callbacks);
        blend.open();
      });
      document.getElementById("military-button").addEventListener("click", async () => {
        const { params } = await fetch("/military-session")
          .then((res) => res.json())
          .catch(() => {
            alert("Could not fetch token");
            return {};
          });

        const callbacks = {
          onEvent: (event) => console.log(`onEvent ${JSON.stringify(event, null, 2)}`),
          onComplete: (data) => console.log(`onComplete ${JSON.stringify(data, null, 2)}`),
        }

        const blend = Truework.direct.blend.init(params, callbacks);
        blend.open();
      });
      document.getElementById("reboot-button").addEventListener("click", async () => {
        const { params } = await fetch("/reboot")
          .then((res) => res.json())
          .catch(() => {
            alert("Could not fetch token");
            return {};
          });

        const callbacks = {
          onEvent: (event) => console.log(`onEvent ${JSON.stringify(event, null, 2)}`),
          onComplete: (data) => console.log(`onComplete ${JSON.stringify(data, null, 2)}`),
        }

        const blend = Truework.direct.blend.init(params, callbacks);
        blend.open();
      });
    </script>
  </body>
</html>
