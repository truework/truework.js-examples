<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Credentials Example</title>

    <link
      rel="stylesheet"
      href="https://unpkg.com/svbstrate@5.1.0/svbstrate.css"
    />
    <link rel="stylesheet" href="style.css" />

    <script src="https://js.truework.com/v1"></script>
  </head>
  <body class="bg-light" style="height: 100vh">
    <div class="h f aic jcc">
      <button id="button">Open Credentials Widget</button>
    </div>

    <script>
      document.getElementById("button").addEventListener("click", async () => {
        const { token } = await fetch("/token")
          .then((res) => res.json())
          .catch(() => {
            alert("Could not fetch token");
            return {};
          });

        const credentials = window.Truework.direct.init({
          publishableKey: "tw_pk_H5Wrx0mzGSoJJywKTtOtzJ1Zg2bKhES_QqC_nEeY3vg", // example key
          sessionToken: token,
          env: Truework.credentials.Env.Production,
        });

        credentials.onOpen(function () {
          console.log("onOpen");
        });
        credentials.onClose(function () {
          console.log("onClose");
        });
        credentials.onSuccess(function () {
          console.log("onSuccess");
        });
        credentials.onError(function (e) {
          console.error(e);
        });

        credentials.open();
      });
    </script>
  </body>
</html>
